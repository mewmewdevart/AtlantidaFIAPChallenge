<svg width="1200" height="350" viewBox="0 0 1200 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root, svg {
        --cidade-cor: #58AAA3;
        --cidade-cor-fundo: var(--cidade-cor, #58AAA3);
        --cidade-cor-meio: var(--cidade-cor, #58AAA3);
        --cidade-cor-frente: var(--cidade-cor, #58AAA3);
        --cidade-opacidade-fundo: 0.35;
        --cidade-opacidade-meio: 0.65;
        --cidade-opacidade-frente: 1;
      }
      #Camada-1-Fundo, .cidade-camada--fundo {
        fill: var(--cidade-cor-fundo, var(--cidade-cor, #58AAA3));
        opacity: var(--cidade-opacidade-fundo, 0.35);
      }
      #Camada-2-Meio, .cidade-camada--meio {
        fill: var(--cidade-cor-meio, var(--cidade-cor, #58AAA3));
        opacity: var(--cidade-opacidade-meio, 0.65);
      }
      #Camada-3-Frente, .cidade-camada--frente {
        fill: var(--cidade-cor-frente, var(--cidade-cor, #58AAA3));
        opacity: var(--cidade-opacidade-frente, 1);
      }
    </style>
  </defs>

